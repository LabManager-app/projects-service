spring.application.name=projects-service

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://postgres:5432/labmanager
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# lab service (container port) - read from environment/configmap
# Use a safe default so the app still starts when the env var is not set
# (you can override with the LAB_SERVICE_URL env or ConfigMap in k8s)
lab.service.url=${LAB_SERVICE_URL:http://labs-service:8080}

